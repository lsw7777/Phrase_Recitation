<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Phrase Studio · 短语学习室</title>
    <style>
        :root {
            --ink: #202b39;
            --muted: #7a8492;
            --orange: #d97736;
            --orange-bg: #fdf0e6;
            --orange-border: #f5c6a1;
            --line: #e4e9f1;
            --bg: #f5f7fb
        }

        * {
            box-sizing: border-box
        }

        html {
            height: 100%
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--bg);
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        button,
        input,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        button:disabled {
            cursor: default;
            opacity: .45
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid #f5b88c;
            outline-offset: 3px
        }

        [hidden] {
            display: none !important
        }

        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--line)
        }

        .top-inner {
            max-width: 1280px;
            margin: auto;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .brand {
            font-size: 14px;
            font-weight: 750;
            letter-spacing: -.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0
        }

        .logo {
            background: var(--orange);
            color: white;
            border-radius: 6px;
            padding: 4px 6px;
            font-family: Georgia, serif;
            font-size: 17px
        }

        main {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 4px 8px 2px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column
        }

        .stats {
            display: flex;
            gap: 14px;
            flex-shrink: 0
        }

        .stat strong {
            display: block;
            font-size: 15px;
            letter-spacing: -0.5px
        }

        .stat span {
            font-size: 10px;
            color: var(--muted)
        }

        .modes {
            display: flex;
            gap: 3px;
            padding: 2px;
            background: #e9edf5;
            border-radius: 8px;
            width: max-content;
            flex-shrink: 0
        }

        .mode {
            border: 0;
            background: none;
            padding: 6px 14px;
            border-radius: 8px;
            color: var(--muted);
            font-weight: 600;
            font-size: 12px
        }

        .mode.active {
            background: white;
            color: var(--orange);
            box-shadow: 0 2px 5px #202b3910
        }

        .topbar,
        .hero,
        .modes,
        footer {
            flex-shrink: 0
        }

        .layout {
            display: grid;
            grid-template-columns: 190px minmax(0, 1fr);
            gap: 12px;
            align-items: stretch;
            flex: 1;
            min-height: 0
        }

        .sidebar {
            background: white;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .content {
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain
        }

        .side-label {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--muted);
            margin: 2px 10px 10px;
            flex-shrink: 0
        }

        .tabs {
            display: grid;
            gap: 3px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain
        }

        .tab[hidden] {
            display: none
        }

        .verb-search {
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            flex: none;
            margin: 0 0 8px;
            padding: 8px 12px;
            border-radius: 9px;
            font-size: 12px
        }

        .verb-empty {
            margin: 8px 10px 2px;
            font-size: 12px;
            color: var(--muted);
            flex-shrink: 0
        }

        .tab {
            border: 0;
            border-radius: 8px;
            background: none;
            color: #596474;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 600
        }

        .tab small {
            font-size: 10px;
            font-weight: 400;
            opacity: .65
        }

        .tab:hover {
            background: #fdf6f1
        }

        .tab.active {
            background: var(--orange-bg);
            color: var(--orange)
        }

        .toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 6px
        }

        input {
            min-width: 110px;
            flex: 1;
            border: 1px solid var(--line);
            background: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            color: var(--ink)
        }

        .btn {
            border: 1px solid var(--line);
            background: white;
            padding: 6px 10px;
            border-radius: 8px;
            color: #596474;
            font-size: 11px
        }

        .btn[aria-pressed=true] {
            border-color: var(--orange-border);
            color: var(--orange);
            background: var(--orange-bg)
        }

        .primary {
            background: var(--orange);
            color: white;
            border-color: var(--orange)
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--muted);
            margin: 6px 0 4px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px
        }

        .card {
            background: white;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px;
            transition: transform .2s, box-shadow .2s;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 0
        }

        .card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px #d9773615
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .tag {
            font-size: 8px;
            color: var(--orange);
            background: var(--orange-bg);
            padding: 2px 5px;
            border-radius: 4px;
            letter-spacing: .3px
        }

        .save {
            border: 0;
            background: none;
            color: #a1aabd;
            font-size: 16px;
            padding: 0 2px
        }

        .save[aria-pressed=true] {
            color: #d39228
        }

        h2 {
            font-size: 14px;
            letter-spacing: -.4px;
            margin: 6px 0 3px;
            font-weight: 650;
            line-height: 1.3
        }

        .meaning {
            font-size: 11px;
            margin: 0 0 4px;
            color: #596474;
            line-height: 1.4
        }

        .example {
            margin: 0;
            border-top: 1px solid #f0f2f6;
            padding-top: 4px;
            color: var(--muted);
            font-family: Georgia, serif;
            font-size: 11px;
            line-height: 1.4
        }

        .hidden-meaning .meaning {
            visibility: hidden
        }

        .mastery {
            font-size: 8px;
            margin-top: 4px;
            color: #8793a6
        }

        .mastery.known {
            color: #258574
        }

        .empty {
            text-align: center;
            padding: 45px;
            color: var(--muted);
            grid-column: 1/-1
        }

        .test-panel {
            background: white;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 28px
        }

        .test-panel h2 {
            margin-top: 0;
            font-size: 22px
        }

        .description {
            color: var(--muted);
            font-size: 13px
        }

        .test-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: end;
            margin: 24px 0
        }

        .test-options label {
            font-size: 12px;
            color: var(--muted);
            display: grid;
            gap: 8px;
            flex: 1;
            min-width: 150px
        }

        select {
            padding: 11px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: white;
            color: var(--ink)
        }
        .test-options .btn.primary {
            padding: 13px 16px
        }

        .session-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            font-size: 12px;
            color: var(--muted)
        }

        progress {
            display: block;
            width: 100%;
            height: 7px;
            border: 0;
            margin: 16px 0 25px;
            border-radius: 8px;
            overflow: hidden;
            accent-color: var(--orange)
        }

        progress::-webkit-progress-bar {
            background: #edf0f6
        }

        progress::-webkit-progress-value {
            background: var(--orange)
        }

        .flashcard {
            display: block;
            width: 100%;
            min-height: 300px;
            border: 1px solid var(--orange-border);
            background: radial-gradient(ellipse at top right, var(--orange-bg), transparent 65%), #fffcfa;
            border-radius: 18px;
            padding: 35px;
            text-align: center;
            color: var(--ink);
            position: relative
        }

        .flashcard .unsave {
            position: absolute;
            bottom: 16px;
            right: 16px;
            font-size: 11px;
            padding: 4px 10px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 6px;
            color: var(--muted);
            cursor: pointer;
            z-index: 2
        }

        .flashcard .unsave:hover {
            background: var(--orange-bg);
            color: var(--orange);
            border-color: var(--orange-border)
        }

        #toast {
            position: fixed;
            background: var(--ink);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }
        #toast.show {
            opacity: 1;
            pointer-events: auto;
        }

        #confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(2px);
        }
        #confirm-modal.show {
            display: flex;
        }
        #confirm-modal .modal-card {
            background: #fff;
            border-radius: 12px;
            padding: 32px 28px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }
        #confirm-modal .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            margin: 0 0 12px;
        }
        #confirm-modal .modal-msg {
            font-size: 14px;
            color: var(--muted);
            margin: 0 0 24px;
            line-height: 1.6;
        }
        #confirm-modal .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        #confirm-modal .btn-confirm {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: var(--orange);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        #confirm-modal .btn-confirm:hover {
            background: #c46a2a;
        }
        #confirm-modal .btn-cancel {
            padding: 10px 24px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            font-size: 14px;
            cursor: pointer;
        }
        #confirm-modal .btn-cancel:hover {
            background: var(--bg);
        }


        .flashcard .flash-tag {
            display: block;
            color: var(--orange);
            font-size: 11px;
            letter-spacing: 2px
        }

        .flash-phrase {
            display: block;
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 650;
            letter-spacing: -1px;
            margin: 22px 0
        }

        .flash-hint {
            display: block;
            font-size: 13px;
            color: var(--muted)
        }

        .answer {
            display: block;
            margin-top: 22px
        }

        .answer-meaning {
            display: block;
            font-size: 20px
        }

        .answer-example {
            display: block;
            color: var(--muted);
            font-family: Georgia, serif;
            font-size: 16px;
            margin-top: 14px;
            line-height: 1.6
        }

        .grading {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 22px
        }

        .grading .btn {
            min-width: 145px
        }

        .again {
            color: #b77722;
            background: #fffaef;
            border-color: #f1dfba
        }

        .known-btn {
            color: #23806b;
            background: #edf9f4;
            border-color: #c5e7da
        }

        .shortcut {
            text-align: center;
            color: var(--muted);
            font-size: 11px;
            margin-top: 15px
        }

        .result {
            text-align: center;
            padding: 38px 10px
        }

        .result strong {
            display: block;
            color: var(--orange);
            font-size: 60px;
            margin: 18px
        }

        .result h3 {
            font-size: 24px
        }

        .result .btn {
            margin: 8px
        }

        .storage-note {
            font-size: 12px;
            color: #a07121;
            margin-top: 15px
        }

        footer {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 32px 28px;
            font-size: 11px;
            color: var(--muted);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            gap: 15px
        }

        @media(min-width:1000px) {
            .test-panel {
                padding: 32px 42px
            }
        }

        @media(max-width:1100px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }
        }

        @media(max-width:720px) {
            main {
                padding: 25px 18px
            }

            .top-inner {
                padding: 17px 18px
            }

            .top-note {
                display: none
            }

            .hero {
                align-items: start
            }

            .stats {
                gap: 15px
            }

            .stat strong {
                font-size: 22px
            }

            .hero h1 {
                font-size: 25px
            }

            .hero p {
                max-width: 230px;
                font-size: 12px
            }

            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
                gap: 18px
            }

            .sidebar {
                padding: 12px
            }

            .side-label {
                margin-bottom: 10px
            }

            .tabs {
                display: flex;
                flex: none;
                overflow-x: auto;
                overflow-y: hidden;
                gap: 6px;
                padding-bottom: 5px
            }

            .tab {
                flex-shrink: 0;
                gap: 8px;
                background: #f6f8fc
            }

            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }

            .card {
                padding: 16px
            }

            h2 {
                font-size: 20px
            }

            .test-panel {
                padding: 20px
            }

            .flashcard {
                padding: 25px 15px
            }

            .meta {
                font-size: 11px
            }

            footer {
                padding: 20px 18px;
                flex-direction: column
            }
        }

        @media(max-width:420px) {
            .grid {
                grid-template-columns: 1fr
            }

            .stats .stat:first-child {
                display: none
            }

            .grading .btn {
                min-width: 0;
                flex: 1
            }

            .mode {
                padding: 10px 20px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }

        /* 三行标题：优雅衬线小字、书法楷书标题、仿宋题注；全部斜体，使用本机字体，无需加载资源。 */
        .hero .eyebrow {
            font-family: "Palatino Linotype", "Book Antiqua", "Palatino", Georgia, serif;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 3px;
            color: #6d3a1f;
        }

        .hero h1 {
            font-family: "KaiTi", "STKaiti", "KaiTi_GB2312", "AR PL UKai CN", serif;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 2px;
            color: #412e25;
            text-shadow: 0 1px 0 #fff4e8;
        }

        .hero p {
            font-family: "FangSong", "STFangsong", "AR PL UKai CN", serif;
            font-style: italic;
            letter-spacing: 1px;
            color: #705547;
            border-left: 2px solid #b96635;
            padding-left: 12px;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="top-inner">
            <div class="brand"><span class="logo">Ps.</span>Phrase Studio</div>
            <nav class="modes" aria-label="学习模式"><button class="mode active" id="browse-mode"
                    aria-pressed="true">短语卡片</button><button class="mode" id="test-mode" aria-pressed="false">卡片测试
                    →</button></nav>
            <div class="stats">
                <div class="stat"><strong id="total">300</strong><span>常用短语</span></div>
                <div class="stat"><strong id="mastered">0</strong><span>已掌握</span></div>
            </div>
        </div>
    </div>
    <main>
        <div class="layout">
            <aside class="sidebar">
                <div class="side-label">动词分类 / VERBS</div>
                <input id="verb-search" class="verb-search" type="search" aria-label="搜索动词"
                    placeholder="搜索动词…">
                <nav class="tabs" aria-label="按动词筛选"></nav>
                <p class="verb-empty" id="verb-empty" hidden>没有匹配的动词</p>
            </aside>
            <div class="content">
                <section id="browse">
                    <div class="toolbar"><input id="search" type="search" aria-label="搜索短语、释义或例句"
                            placeholder="搜索短语或中文释义…"><button class="btn" id="meanings"
                            aria-pressed="false">隐藏释义</button><button class="btn" id="favorites" aria-pressed="false">☆
                            收藏</button></div>
                    <div class="meta"><span id="count" role="status" aria-live="polite"></span><button
                            class="btn primary" id="test-current">测试当前短语 →</button></div>
                    <div class="grid" id="cards"></div>
                </section>
                <section id="test" class="test-panel" hidden>
                    <div id="setup"><span class="eyebrow">RECALL BEFORE YOU REVEAL</span>
                        <h2>一张卡片，一次主动回忆。</h2>
                        <p class="description">先看英文短语，回忆中文意思。翻开答案后，诚实标记掌握情况。<br>这是自评练习，掌握记录会保存在当前浏览器。</p>
                        <div class="test-options"><label>练习范围<select id="scope">
                                    <option value="current">当前筛选的短语</option>
                                    <option value="all">全部短语</option>
                                    <option value="saved">收藏的短语</option>
                                    <option value="review">需复习的短语</option>
                                    <option value="new">未测试的短语</option>
                                </select></label><label>出卡顺序<select id="order">
                                    <option value="random">随机顺序</option>
                                    <option value="normal">原始顺序</option>
                                </select></label><button id="start" class="btn primary">开始测试 →</button></div>
                        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                            <p class="description" id="pool-count" role="status" aria-live="polite"></p>
                            <button id="clear-review" class="btn primary">清空需复习队列</button>
                        </div>
                    </div>
                    <div id="session" hidden>
                        <div class="session-top"><button id="back-to-setup" class="btn">返回</button><span id="session-count" role="status"
                                aria-live="polite"></span><button id="exit" class="btn">结束本轮</button></div><progress
                            id="progress" value="0" max="1" aria-label="本轮测试进度"></progress><button class="flashcard"
                            id="flashcard" aria-label="显示答案"><span class="flash-tag" id="flash-tag"></span><span
                                class="flash-phrase" id="flash-phrase" lang="en"></span><span class="flash-hint"
                                id="hint">点击卡片查看答案</span><span class="answer" id="answer" hidden><span
                                    class="answer-meaning" id="answer-meaning"></span><span class="answer-example"
                                    id="answer-example" lang="en"></span></span><span class="unsave" id="unsave"
                                hidden>取消收藏</span></button>
                        <div class="grading"><button class="btn" id="prev" disabled>← 上一张</button><button
                                class="btn primary" id="reveal">显示答案</button><button class="btn again" id="again"
                                hidden>↺ 需复习</button><button class="btn known-btn" id="known" hidden>✓ 已掌握</button>
                        </div>
                        <p class="shortcut" id="shortcut">← 上一张 ；→ 显示答案</p>
                    </div>
                    <div id="result" class="result" hidden><span class="eyebrow">SESSION COMPLETE</span>
                        <h3 id="result-title">本轮练习完成</h3><strong id="result-score"></strong>
                        <p class="description" id="result-detail"></p><button class="btn primary"
                            id="retry">再练需复习的短语</button><button class="btn" id="restart">选择新一轮练习</button>
                    </div>
                </section>
                <p class="storage-note" id="storage-note" hidden>浏览器存储不可用，本次记录仅在当前页面有效。</p>
            </div>
        </div>
    </main>
    <footer><span>PHRASE STUDIO / 英语短语学习室</span><span>包含短语动词与常用搭配 · 展示常见含义</span></footer>
    <script>
        const raw = {
            run: [

                ['check the time', '看时间', 'He checked the time and hurried out of the door.'],
                ['check your facts', '核实事实', 'Always check your facts before publishing.']],
            fill: [
                ['fill in', '填写（表格）；临时替代', 'Please fill in your name and address.'],
                ['fill out', '填写（表格）', 'Fill out this form before the interview.'],
                ['fill up', '加满；装满', 'The driver filled up the tank at the station.'],
                ['fill in for', '临时替代（某人）', 'Can you fill in for me on Friday?'],
                ['fill someone in on', '向某人介绍（情况）', 'She filled me in on the latest news.'],
                ['fill up with', '充满', 'Her eyes filled up with tears of joy.'],
                ['fill a need', '满足需求', 'The new store fills a need in the neighborhood.'],
                ['fill the gap', '填补空白', 'This course fills the gap in my knowledge.'],
                ['fill the role', '胜任……的角色', 'She fills the role of team leader well.'],
                ['fill someone’s shoes', '接替某人的位置', 'It won’t be easy to fill her shoes.']],
            hang: [
                ['hang out', '闲逛；常去', 'We hang out at the cafe after class.'],
                ['hang up', '挂断电话', 'She hung up before I could answer.'],
                ['hang on', '稍等；坚持', 'Hang on, I’ll be right there.'],
                ['hang around', '逗留；闲荡', 'They hung around the station all afternoon.'],
                ['hang together', '连贯；团结', 'The story doesn’t hang together very well.'],
                ['hang back', '踌躇；退缩', 'A few students hung back after class to ask questions.'],
                ['hang on to', '紧紧抓住；保留', 'Hang on to your ticket until the end of the show.'],
                ['hang in there', '坚持住；别放弃', 'Hang in there; the exam is almost over.'],
                ['hang your head', '低头（表示羞愧）', 'He hung his head in shame after the mistake.'],
                ['hang a picture', '挂画', 'We hung a picture above the sofa.']]
        };

        const entries = Object.entries(raw).flatMap(([verb, rows]) =>
          rows.map(([phrase, meaning, example]) => ({ verb, phrase, meaning, example }))
        );
        const $ = s => document.querySelector(s);
        let saved = new Set();
        let mastery = {};
        let verb = 'all';
        let onlySaved = false;
        let hideMeaning = false;
        let mode = 'browse';
        let queue = [];
        let position = 0;
        let revealed = false;
        let results = [];
        async function idbOpen() {
          return new Promise((res, rej) => {
            const req = indexedDB.open('phrase-studio', 1);
            req.onerror = () => rej(req.error);
            req.onupgradeneeded = () => req.result.createObjectStore('progress');
            req.onsuccess = () => res(req.result);
          });
        }
        async function idbGet(key) {
          const d = await idbOpen();
          return new Promise((res, rej) => {
            const g = d.transaction('progress').objectStore('progress').get(key);
            g.onsuccess = () => res(g.result);
            g.onerror = () => rej(g.error);
          });
        }
        async function idbPut(key, val) {
          const d = await idbOpen();
          return new Promise((res, rej) => {
            const p = d.transaction('progress', 'readwrite').objectStore('progress').put(val, key);
            p.onsuccess = () => res();
            p.onerror = () => rej(p.error);
          });
        }
        async function loadData() {
          try {
            const a = await idbGet('verb-atlas-saved');
            if (Array.isArray(a)) saved = new Set(a.filter(x => typeof x === 'string'));
            const b = await idbGet('phrase-studio-mastery');
            if (b && typeof b === 'object' && !Array.isArray(b))
              for (const e of entries)
                if (['known', 'review'].includes(b[e.phrase]))
                  mastery[e.phrase] = b[e.phrase];

            const v = await idbGet('verb-atlas-verb');
            if (typeof v === 'string') verb = v;

            const os = await idbGet('verb-atlas-onlySaved');
            if (typeof os === 'boolean') onlySaved = os;

            const hm = await idbGet('verb-atlas-hideMeaning');
            if (typeof hm === 'boolean') hideMeaning = hm;

            const m = await idbGet('verb-atlas-mode');
            if (m === 'browse' || m === 'test') mode = m;

            const scopeEl = $('#scope');
            const s = await idbGet('verb-atlas-scope');
            if (s && ['current','all','saved','review','new'].includes(s)) scopeEl.value = s;

            const orderEl = $('#order');
            const o = await idbGet('verb-atlas-order');
            if (o && ['random','normal'].includes(o)) orderEl.value = o;

            const q = await idbGet('verb-atlas-queue');
            if (Array.isArray(q)) queue = q;
            const p = await idbGet('verb-atlas-position');
            if (typeof p === 'number') position = p;
            const rv = await idbGet('verb-atlas-revealed');
            if (typeof rv === 'boolean') revealed = rv;
            const res = await idbGet('verb-atlas-results');
            if (Array.isArray(res)) results = res;
          } catch { }
          render();

          // 恢复模式与按钮状态
          if (mode === 'test') {
            $('#browse').hidden = true;
            $('#test').hidden = false;
            $('#browse-mode').classList.remove('active');
            $('#test-mode').classList.add('active');
            $('#browse-mode').setAttribute('aria-pressed', 'false');
            $('#test-mode').setAttribute('aria-pressed', 'true');
            if (queue.length && position < queue.length) {
              $('#setup').hidden = true;
              $('#session').hidden = false;
              $('#result').hidden = true;
              if (revealed) {
                $('#answer').hidden = false;
                $('#hint').hidden = true;
                $('#reveal').hidden = true;
                $('#again').hidden = false;
                $('#known').hidden = false;
                $('#shortcut').textContent = '← 上一张 ；Space 需复习 ；→ 已掌握';
              } else {
                $('#answer').hidden = true;
                $('#hint').hidden = false;
                $('#reveal').hidden = false;
                $('#again').hidden = true;
                $('#known').hidden = true;
                $('#shortcut').textContent = '← 上一张 ；→ 显示答案';
              }
              showCard();
            }
          } else {
            $('#browse').hidden = false;
            $('#test').hidden = true;
            $('#browse-mode').classList.add('active');
            $('#test-mode').classList.remove('active');
            $('#browse-mode').setAttribute('aria-pressed', 'true');
            $('#test-mode').setAttribute('aria-pressed', 'false');
          }

          // 恢复动词标签状态
          document.querySelectorAll('.tab').forEach(t => {
            const active = t.dataset.verb === verb;
            t.classList.toggle('active', active);
            t.setAttribute('aria-pressed', String(active));
          });

          // 恢复收藏/释义开关状态
          $('#favorites').setAttribute('aria-pressed', String(onlySaved));
          $('#favorites').textContent = onlySaved ? '★ 只看收藏' : '☆ 收藏';
          $('#meanings').setAttribute('aria-pressed', String(hideMeaning));
          $('#meanings').textContent = hideMeaning ? '显示释义' : '隐藏释义';
        }
        async function persist() {
          try {
            await idbPut('verb-atlas-saved', [...saved]);
            await idbPut('phrase-studio-mastery', mastery);
            await idbPut('verb-atlas-verb', verb);
            await idbPut('verb-atlas-onlySaved', onlySaved);
            await idbPut('verb-atlas-hideMeaning', hideMeaning);
            await idbPut('verb-atlas-mode', mode);
            await idbPut('verb-atlas-scope', $('#scope').value);
            await idbPut('verb-atlas-order', $('#order').value);
            if (mode === 'test') {
              await idbPut('verb-atlas-queue', queue);
              await idbPut('verb-atlas-position', position);
              await idbPut('verb-atlas-revealed', revealed);
              await idbPut('verb-atlas-results', results);
            }
          } catch { $('#storage-note').hidden = false; }
        }
        function filtered() {
          const q = $('#search').value.trim().toLowerCase();
          return entries.filter(e =>
            (verb === 'all' || e.verb === verb) &&
            (!onlySaved || saved.has(e.phrase)) &&
            [e.phrase, e.meaning, e.example].some(x => x.toLowerCase().includes(q))
          );
        }
        function render() {
          const list = filtered();
          $('#total').textContent = entries.length;
          $('#mastered').textContent = entries.filter(e => mastery[e.phrase] === 'known').length;
          $('#count').textContent = (verb === 'all' ? '全部动词' : verb) + ' · ' + list.length + ' 个短语';
          $('#test-current').disabled = !list.length;
          const grid = $('#cards');
          grid.replaceChildren();
          grid.classList.toggle('hidden-meaning', hideMeaning);
          for (const e of list) {
            const card = document.createElement('article');
            card.className = 'card';
            const top = document.createElement('div');
            top.className = 'card-top';
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = e.verb.toUpperCase();
            const save = document.createElement('button');
            save.className = 'save';
            save.textContent = saved.has(e.phrase) ? '★' : '☆';
            save.setAttribute('aria-pressed', String(saved.has(e.phrase)));
            save.setAttribute('aria-label', '收藏 ' + e.phrase);
            save.onclick = () => {
              saved.has(e.phrase) ? saved.delete(e.phrase) : saved.add(e.phrase);
              persist();
              render();
            };
            top.append(tag, save);
            const title = document.createElement('h2');
            title.textContent = e.phrase;
            title.lang = 'en';
            const meaning = document.createElement('p');
            meaning.className = 'meaning';
            meaning.textContent = e.meaning;
            meaning.setAttribute('aria-hidden', String(hideMeaning));
            const example = document.createElement('p');
            example.className = 'example';
            example.lang = 'en';
            example.textContent = e.example;
            const state = document.createElement('div');
            state.className = 'mastery' + (mastery[e.phrase] === 'known' ? ' known' : '');
            state.textContent = mastery[e.phrase] === 'known' ? '✓ 已掌握' : mastery[e.phrase] === 'review' ? '↺ 需复习' : '○ 未测试';
            card.append(top, title, meaning, example, state);
            grid.append(card);
          }
          if (!list.length) {
            const empty = document.createElement('p');
            empty.className = 'empty';
            empty.textContent = '没有匹配的短语，试试调整搜索或收藏筛选。';
            grid.append(empty);
          }
          updatePool();
        }
        for (const v of ['all', ...Object.keys(raw)]) {
          const b = document.createElement('button');
          b.className = 'tab' + (v === 'all' ? ' active' : '');
          b.dataset.verb = v;
          const label = document.createElement('span');
          label.textContent = v === 'all' ? '全部短语' : v;
          const count = document.createElement('small');
          count.textContent = v === 'all' ? entries.length : raw[v].length;
          b.append(label, count);
          b.setAttribute('aria-pressed', String(v === 'all'));
          b.onclick = () => {
            verb = v;
            document.querySelectorAll('.tab').forEach(t => {
              t.classList.toggle('active', t === b);
              t.setAttribute('aria-pressed', String(t === b));
            });
            persist();
            render();
            $('.content').scrollTop = 0;
          };
          $('.tabs').append(b);
        }
        const verbSearch = $('#verb-search');
        verbSearch.oninput = () => {
          const q = verbSearch.value.trim().toLowerCase();
          let hits = 0;
          document.querySelectorAll('.tab').forEach(t => {
            const isAll = t.dataset.verb === 'all';
            const show = !q || isAll || t.dataset.verb.includes(q);
            t.hidden = !show;
            if (show && !isAll) hits++;
          });
          $('#verb-empty').hidden = !(q && !hits);
        };
        verbSearch.onkeydown = e => {
          if (e.key !== 'Enter') return;
          const first = [...document.querySelectorAll('.tab')].find(t => !t.hidden && t.dataset.verb !== 'all');
          if (first) first.click();
        };
        function pool() {
          switch ($('#scope').value) {
            case 'all': return entries;
            case 'saved': return entries.filter(e => saved.has(e.phrase));
            case 'review': return entries.filter(e => mastery[e.phrase] === 'review');
            case 'new': return entries.filter(e => !mastery[e.phrase]);
            default: return filtered();
          }
        }
        function updatePool() {
          const n = pool().length;
          $('#pool-count').textContent = n
            ? n + ' 个短语可供练习。每轮逐张测试，可随时结束。'
            : '该范围暂无短语，请选择其他范围。';
          $('#start').disabled = !n;
          // 只有“需复习的短语”范围才显示清空需复习队列按钮
          $('#clear-review').hidden = $('#scope').value !== 'review';
        }
        function hasUnfinishedTest() {
          return queue.length > 0 && position < queue.length;
        }

        function confirmResumeOrNew() {
          if (!hasUnfinishedTest()) return Promise.resolve('new');
          return new Promise((resolve) => {
            const modal = $('#confirm-modal');
            const title = $('#confirm-title');
            const msg = $('#confirm-msg');
            const okBtn = $('#confirm-ok');
            const cancelBtn = $('#confirm-cancel');

            title.textContent = '检测到未完成的练习';
            msg.textContent = '第 ' + (position + 1) + ' / ' + queue.length + ' 张未完成。\n点击“确定”开始新练习，点击“取消”继续旧练习。';

            modal.classList.add('show');

            const cleanup = () => {
              modal.classList.remove('show');
              okBtn.onclick = null;
              cancelBtn.onclick = null;
            };

            okBtn.onclick = () => {
              cleanup();
              resolve('new');
            };
            cancelBtn.onclick = () => {
              cleanup();
              resolve('resume');
            };
          });
        }

        function switchMode(next) {
          mode = next;
          persist();
          $('#browse').hidden = next !== 'browse';
          $('#test').hidden = next !== 'test';
          for (const name of ['browse', 'test']) {
            $('#' + name + '-mode').classList.toggle('active', next === name);
            $('#' + name + '-mode').setAttribute('aria-pressed', String(next === name));
          }
          updatePool();

          // 切换到测试模式且有未完成的练习，直接恢复测试界面
          if (next === 'test' && hasUnfinishedTest()) {
            $('#setup').hidden = true;
            $('#session').hidden = false;
            $('#result').hidden = true;
            showCard();
          }
        }
        function showSetup() {
          $('#setup').hidden = false;
          $('#session').hidden = true;
          $('#result').hidden = true;
          updatePool();
        }
        function begin(list) {
          if (!list.length) return;
          queue = [...list];
          if ($('#order').value === 'random')
            for (let i = queue.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [queue[i], queue[j]] = [queue[j], queue[i]];
            }
          position = 0;
          results = [];
          persist();
          $('#setup').hidden = true;
          $('#result').hidden = true;
          $('#session').hidden = false;
          showCard();
        }
        function showCard() {
          revealed = false;
          const e = queue[position];
          const reviewCount = results.filter(r => r.state === 'review').length;
          $('#session-count').textContent = '第 ' + (position + 1) + ' / ' + queue.length + ' 张 · 已完成 ' + position + ' 张 · 需复习 ' + reviewCount + ' 张';
          $('#progress').max = queue.length;
          $('#progress').value = position;
          $('#flash-tag').textContent = e.verb.toUpperCase() + ' / RECALL';
          $('#flash-phrase').textContent = e.phrase;
          $('#answer-meaning').textContent = e.meaning;
          $('#answer-example').textContent = e.example;
          $('#answer').hidden = true;
          $('#hint').hidden = false;
          $('#reveal').hidden = false;
          $('#again').hidden = true;
          $('#known').hidden = true;
          $('#flashcard').setAttribute('aria-label', e.phrase + '，点击显示答案');
          $('#flashcard').focus();
          $('#prev').disabled = position <= 0;
          $('#unsave').hidden = !saved.has(e.phrase);
          $('#shortcut').textContent = '← 上一张 ；→ 显示答案';
          persist();
        }
        function prevCard() {
          if ($('#session').hidden || position <= 0) return;
          position--;
          results = results.filter((_, i) => i < position);
          persist();
          showCard();
        }
        function reveal() {
          if ($('#session').hidden || revealed) return;
          revealed = true;
          $('#answer').hidden = false;
          $('#hint').hidden = true;
          $('#reveal').hidden = true;
          $('#again').hidden = false;
          $('#known').hidden = false;
          $('#flashcard').setAttribute('aria-label', queue[position].phrase + '，' + queue[position].meaning);
          $('#again').focus();
          $('#shortcut').textContent = '← 上一张 ；Space 需复习 ；→ 已掌握';
          persist();
        }
        function grade(state) {
          if (!revealed || $('#session').hidden) return;
          const e = queue[position];
          mastery[e.phrase] = state;
          results.push({ entry: e, state });
          persist();
          position++;
          render();
          if (position >= queue.length) finish();
          else showCard();
        }
        function finish() {
          $('#session').hidden = true;
          $('#result').hidden = false;
          const known = results.filter(r => r.state === 'known').length;
          $('#result-title').textContent = position === queue.length ? '本轮练习完成' : '本轮练习已结束';
          $('#result-score').textContent = known + ' / ' + results.length;
          $('#result-detail').textContent = '已掌握 ' + known + ' 个 · 需复习 ' + (results.length - known) + ' 个 · 未测试 ' + (queue.length - results.length) + ' 个。已完成的记录已更新。';
          $('#retry').disabled = !results.some(r => r.state === 'review');
          $('#restart').focus();
          queue = [];
          position = 0;
          results = [];
          revealed = false;
          mode = 'browse';
          persist();
        }
        $('#browse-mode').onclick = () => switchMode('browse');
        $('#test-mode').onclick = () => switchMode('test');
        $('#test-current').onclick = async () => {
          const action = await confirmResumeOrNew();
          if (action === 'resume') {
            $('#setup').hidden = true;
            $('#session').hidden = false;
            $('#result').hidden = true;
            showCard();
            return;
          }
          // 开始新练习：先清空旧测试状态，直接开始
          queue = [];
          position = 0;
          results = [];
          revealed = false;
          persist();
          $('#scope').value = 'current';
          switchMode('test');
          begin(pool());
        };
        $('#search').oninput = render;
        $('#meanings').onclick = function () {
          hideMeaning = !hideMeaning;
          this.textContent = hideMeaning ? '显示释义' : '隐藏释义';
          this.setAttribute('aria-pressed', String(hideMeaning));
          persist();
          render();
        };
        $('#favorites').onclick = function () {
          onlySaved = !onlySaved;
          this.setAttribute('aria-pressed', String(onlySaved));
          this.textContent = onlySaved ? '★ 只看收藏' : '☆ 收藏';
          persist();
          render();
        };
        $('#scope').onchange = () => { updatePool(); persist(); };
        $('#order').onchange = () => { updatePool(); persist(); };
        $('#clear-review').onclick = () => {
          let cleared = 0;
          for (const phrase of Object.keys(mastery)) {
            if (mastery[phrase] === 'review') {
              delete mastery[phrase];
              cleared++;
            }
          }
          if (cleared > 0) {
            persist();
            render();
            updatePool();
          }
        };
        $('#back-to-setup').onclick = () => showSetup();
        $('#start').onclick = async () => {
          const action = await confirmResumeOrNew();
          if (action === 'resume') {
            $('#setup').hidden = true;
            $('#session').hidden = false;
            $('#result').hidden = true;
            showCard();
            return;
          }
          begin(pool());
        };
        $('#flashcard').onclick = reveal;
        $('#unsave').onclick = (e) => {
          e.stopPropagation();
          saved.delete(queue[position].phrase);
          mastery[queue[position].phrase] = 'known';
          persist();
          showToast('收藏夹剩余 ' + saved.size + ' 个词组');
          position++;
          if (position >= queue.length) finish();
          else showCard();
        };

        function showToast(msg) {
          const t = $('#toast');
          const card = $('#flashcard');
          const rect = card.getBoundingClientRect();
          t.textContent = msg;
          t.style.left = (rect.left + rect.width / 2) + 'px';
          t.style.top = (rect.top + rect.height / 2) + 'px';
          t.style.transform = 'translate(-50%, -50%)';
          t.classList.add('show');
          clearTimeout(t._timer);
          t._timer = setTimeout(() => t.classList.remove('show'), 1000);
        }
        $('#prev').onclick = prevCard;
        $('#reveal').onclick = reveal;
        $('#again').onclick = () => grade('review');
        $('#known').onclick = () => grade('known');
        $('#exit').onclick = finish;
        $('#restart').onclick = showSetup;
        $('#retry').onclick = () => begin(results.filter(r => r.state === 'review').map(r => r.entry));
        document.addEventListener('keydown', e => {
          if (mode !== 'test' || $('#session').hidden || e.repeat || e.ctrlKey || e.altKey || e.metaKey || ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
          if (revealed) {
            if (e.key === 'ArrowRight') { e.preventDefault(); grade('known'); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); prevCard(); }
            else if (e.code === 'Space') { e.preventDefault(); grade('review'); }
          } else {
            if (e.key === 'ArrowRight') { e.preventDefault(); reveal(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); prevCard(); }
          }
        });
        loadData();
    </script>
    <div id="toast" role="status" aria-live="polite"></div>

    <div id="confirm-modal">
        <div class="modal-card">
            <div class="modal-title" id="confirm-title">此页面显示</div>
            <div class="modal-msg" id="confirm-msg"></div>
            <div class="modal-actions">
                <button id="confirm-ok" class="btn-confirm">确定</button>
                <button id="confirm-cancel" class="btn-cancel">取消</button>
            </div>
        </div>
    </div>
</body>

</html
